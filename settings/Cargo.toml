[package]
name = "deskpause-settings"
version = "1.3.1"
edition = "2021"
publish = false
license = "MIT"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
strip = true
lto = "thin"
codegen-units = 1
